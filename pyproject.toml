[project]
name = "ragm4"
version = "0.1.0"
description = "Local RAG on Apple Silicon: LlamaIndex + Ollama (Qwen2.5) + nomic-embed + ChromaDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "llama-index-vector-stores-chroma>=0.2.0",
    "llama-index-readers-file>=0.2.0",
    # Local LLM engine (Ollama daemon)
    "llama-index-llms-ollama>=0.11.0",
    # Embedding backend (nomic-bert needs einops for its custom code)
    "sentence-transformers>=3.0.0",
    "einops>=0.7.0",
    # Vector store
    "chromadb>=0.5.0",
    # Configuration (.env) + Ollama daemon/model lifecycle over HTTP
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragm4"]
